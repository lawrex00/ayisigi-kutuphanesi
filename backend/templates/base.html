<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ay Işığı Kütüphanesi{% endblock %}</title>
  <style>
    :root {
      --bg: #0f0e14;
      --surface: #1a1822;
      --text: #f0ebe3;
      --muted: #9a9288;
      --accent: #c9a86c;
      --border: #2d2a35;
      --danger: #e07070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 3rem 1.5rem; }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; color: var(--accent); }
    p.sub { color: var(--muted); margin: 0 0 2rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; color: var(--muted); }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
    }
    button, .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #1a1208;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 0.75rem;
    }
    .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
    .messages li { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; background: #3a2020; color: var(--danger); }
    .divider { text-align: center; color: var(--muted); margin: 1.25rem 0; font-size: 0.85rem; }
    .links { text-align: center; margin-top: 1.5rem; font-size: 0.95rem; }
    .links a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
