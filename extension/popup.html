<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Ay Işığı Aktarıcı</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font: 14px system-ui, sans-serif;
        background: #1a1a2e;
        color: #eee;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #aaa;
        line-height: 1.5;
      }
      code {
        background: #2a2a44;
        padding: 2px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Ay Işığı Aktarıcı</h1>
    <p>
      Wattpad'te kitap sayfasında sağ alttaki mor
      <strong>Ay Işığı'na Senkronize Et</strong> düğmesine bas.
    </p>
    <p>
      Wattpad'te metni değiştirdikten sonra önce
      <strong>Değişiklikleri Yayınla</strong>, sonra senkronize et.
      Aynı kitap güncellenir; kopya oluşmaz.
    </p>
    <p>Site: <code>localhost:3000</code> çalışıyor olmalı.</p>
  </body>
</html>
