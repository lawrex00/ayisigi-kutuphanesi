services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayisigi-kutuphane
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - SQLITE_PATH=/app/data/wattpad.db
    volumes:
      - ./data:/app/data
